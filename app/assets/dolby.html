<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --bg: #0c0a08;
    --card: rgba(244, 239, 230, .035);
    --ink: #f4efe6;
    --muted: rgba(244, 239, 230, .55);
    --faint: rgba(244, 239, 230, .3);
    --line: rgba(244, 239, 230, .12);
    --accent: #ff4d1c;
    --accent-soft: rgba(255, 77, 28, .16);
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Manrope", -apple-system, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --dim: 0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden; padding: 0 26px 46px;
    display: flex; flex-direction: column; align-items: center;
  }

  .glow {
    position: fixed; width: 170vw; height: 170vw; left: 50%; top: 24%;
    transform: translate(-50%, -50%) scale(calc(1 - var(--dim) * .38));
    background: radial-gradient(circle, rgba(255,77,28, calc(.2 - var(--dim) * .15)) 0%, transparent 58%);
    border-radius: 50%; pointer-events: none; z-index: 0;
    transition: transform 1.1s var(--ease), background 1.1s var(--ease);
  }
  .grain {
    position: fixed; inset: -50%; width: 200%; height: 200%; z-index: 60;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: .05; pointer-events: none; animation: grain 7s steps(8) infinite;
  }
  @keyframes grain {
    0%,100% { transform: translate(0,0); } 25% { transform: translate(-2%,3%); }
    50% { transform: translate(3%,-2%); } 75% { transform: translate(-3%,-3%); }
  }

  header { width: 100%; padding-top: max(44px, env(safe-area-inset-top, 0px)); text-align: center; position: relative; z-index: 10; }
  .topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .lang { display: flex; gap: 6px; }
  .lang button {
    background: none; border: 1px solid var(--line); color: var(--faint); border-radius: 100px;
    padding: 5px 11px; font-family: var(--sans); font-size: .66rem; font-weight: 700; letter-spacing: .1em;
  }
  .lang button.active { color: var(--ink); border-color: rgba(255,77,28,.5); background: var(--accent-soft); }
  .devchip {
    font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
    border: 1px solid var(--line); border-radius: 100px; padding: 5px 11px;
  }
  .devchip.hp { color: var(--accent); border-color: rgba(255,77,28,.4); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.5rem, 11vw, 3.5rem); line-height: .98; letter-spacing: -.02em; }
  h1 em { font-style: italic; color: var(--accent); text-shadow: 0 0 34px rgba(255,77,28, calc(.55 - var(--dim) * .45)); transition: color 1s var(--ease), text-shadow 1s var(--ease); }
  .sub { margin-top: 8px; color: var(--faint); font-size: .74rem; }

  .stage { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 26px; margin: 30px 0 8px; position: relative; z-index: 10; }
  .eqhead { display: flex; align-items: flex-end; justify-content: center; gap: 7px; height: 92px; width: 100%; max-width: 300px; }
  .eqhead i {
    display: block; width: 7px; border-radius: 4px;
    background: linear-gradient(to top, var(--accent), rgba(255,77,28,.35));
    height: calc(10px + (1 - var(--dim)) * var(--h));
    transform-origin: bottom;
    animation: dance calc(var(--t) * 1s) ease-in-out infinite alternate;
    animation-play-state: paused; transition: height 1s var(--ease), background 1s var(--ease);
  }
  body.on .eqhead i { animation-play-state: running; }
  @keyframes dance { from { transform: scaleY(.28); } to { transform: scaleY(1); } }
  body.off .eqhead i { background: linear-gradient(to top, rgba(244,239,230,.22), rgba(244,239,230,.06)); }

  .switch {
    position: relative; width: 196px; height: 76px; border-radius: 100px;
    border: 1px solid var(--line); background: rgba(244,239,230,.04);
    transition: background .6s var(--ease), border-color .6s var(--ease), box-shadow .6s var(--ease);
    box-shadow: inset 0 1px 0 rgba(244,239,230,.05); outline: none; font-family: var(--sans);
  }
  body.on .switch { background: var(--accent-soft); border-color: rgba(255,77,28,.45); box-shadow: 0 0 44px rgba(255,77,28,.26), inset 0 1px 0 rgba(255,255,255,.06); }
  .knob { position: absolute; top: 9px; left: 9px; width: 56px; height: 56px; border-radius: 50%; background: var(--ink); transition: transform .55s var(--spring), background .6s var(--ease); box-shadow: 0 10px 26px rgba(0,0,0,.45); }
  body.on .knob { transform: translateX(120px); background: var(--accent); }
  .knob::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 46%); opacity: .5; }
  .switch .cap { position: absolute; top: 50%; transform: translateY(-50%); font-size: .68rem; font-weight: 700; letter-spacing: .18em; color: var(--faint); transition: opacity .5s var(--ease), color .5s var(--ease); }
  .cap.off { left: 26px; } .cap.on { right: 26px; }
  body.on .cap.on { color: var(--accent); }
  body.on .cap.off { opacity: .25; }
  body.off .cap.on { opacity: .25; }

  .status { font-family: var(--serif); font-size: 1.25rem; font-weight: 500; text-align: center; }
  body.off .status { color: var(--muted); }
  .status .dot { display: inline-block; width: 7px; height: 7px; margin-right: 9px; border-radius: 50%; background: var(--accent); vertical-align: middle; box-shadow: 0 0 14px var(--accent); animation: pulse 2.2s ease-in-out infinite; }
  body.off .status .dot { background: var(--faint); box-shadow: none; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .panel { width: 100%; max-width: 460px; position: relative; z-index: 10; margin-top: 26px; }
  .panel h2 { font-size: .62rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin-bottom: 13px; display: flex; align-items: center; gap: 10px; }
  .panel h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 15px; border-radius: 100px; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-family: var(--sans); font-size: .78rem; font-weight: 600;
    transition: all .35s var(--ease);
  }
  .chip.active { background: var(--accent-soft); border-color: rgba(255,77,28,.5); color: var(--ink); box-shadow: 0 0 22px rgba(255,77,28,.18); }

  .rows { display: flex; flex-direction: column; gap: 4px; }
  .row { padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid rgba(244,239,230,.06); }
  .row .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; }
  .row .name { font-size: .86rem; font-weight: 600; }
  .row .val { font-family: var(--serif); font-size: 1rem; color: var(--accent); }
  .row .desc { color: var(--faint); font-size: .66rem; margin-top: 8px; line-height: 1.45; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(244,239,230,.14); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); box-shadow: 0 3px 12px rgba(0,0,0,.5), 0 0 16px rgba(255,77,28,.45); }

  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .tg {
    flex: 1 1 45%; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 15px; border-radius: 16px; background: var(--card);
    border: 1px solid rgba(244,239,230,.06); font-size: .8rem; font-weight: 600; color: var(--muted);
    transition: all .35s var(--ease); text-align: left; font-family: var(--sans);
  }
  .tg .lamp { width: 28px; height: 17px; border-radius: 20px; background: rgba(244,239,230,.14); position: relative; flex: 0 0 auto; margin-left: 8px; transition: background .35s var(--ease); }
  .tg .lamp::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--faint); transition: transform .35s var(--spring), background .35s var(--ease); }
  .tg.active { color: var(--ink); border-color: rgba(255,77,28,.35); }
  .tg.active .lamp { background: var(--accent-soft); }
  .tg.active .lamp::after { transform: translateX(11px); background: var(--accent); }

  /* эквалайзер */
  .geq { position: relative; height: 126px; display: flex; gap: 3px; padding: 12px 10px; border-radius: 18px; background: var(--card); border: 1px solid rgba(244,239,230,.06); touch-action: none; }
  .geq .col { flex: 1 1 0; position: relative; }
  .geq .mid { position: absolute; left: -2px; right: -2px; top: 50%; height: 1px; background: rgba(244,239,230,.13); }
  .geq .zero { position: absolute; left: 50%; transform: translateX(-50%); width: 62%; top: 50%; height: 2px; background: rgba(244,239,230,.25); border-radius: 2px; }
  .geq .bar { position: absolute; left: 50%; transform: translateX(-50%); width: 62%; border-radius: 3px; background: linear-gradient(to top, var(--accent), rgba(255,77,28,.45)); transition: height .07s linear, top .07s linear, background .2s var(--ease); }
  .geq .bar.neg { background: linear-gradient(to bottom, rgba(244,239,230,.45), rgba(244,239,230,.2)); }
  .scale { display: flex; justify-content: space-between; margin-top: 7px; color: var(--faint); font-size: .56rem; }
  .eqinfo { margin-top: 9px; color: var(--faint); font-size: .68rem; }

  .presets { display: flex; flex-direction: column; gap: 8px; }
  .prow { display: flex; gap: 8px; }
  .prow input[type=text] {
    flex: 1; background: rgba(244,239,230,.05); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font-family: var(--sans); font-size: .8rem; padding: 10px 12px; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  textarea {
    width: 100%; min-height: 110px; background: rgba(244,239,230,.05); border: 1px solid var(--line);
    border-radius: 12px; color: var(--muted); font-family: var(--sans); font-size: .66rem;
    line-height: 1.5; padding: 11px 12px; outline: none; resize: vertical;
    user-select: text; -webkit-user-select: text;
  }
  .small { font-size: .72rem; font-weight: 700; letter-spacing: .05em; color: var(--muted); background: rgba(244,239,230,.06); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-family: var(--sans); }
  .small.accent { color: var(--ink); border-color: rgba(255,77,28,.45); background: var(--accent-soft); }
  .plist { display: flex; flex-wrap: wrap; gap: 8px; }
  .pitem { display: flex; align-items: center; gap: 6px; }
  .pitem .del { color: var(--faint); font-size: .8rem; padding: 0 2px; background: none; border: none; }

  footer { width: 100%; max-width: 460px; margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 11px; position: relative; z-index: 10; }
  .hint { color: var(--faint); font-size: .7rem; text-align: center; line-height: 1.55; }
  .link { background: none; border: none; color: var(--muted); font-family: var(--sans); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  pre.log { width: 100%; max-height: 220px; overflow: auto; margin-top: 10px; padding: 13px; border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--muted); font-size: .6rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; display: none; }
  .badge { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px);
    background: rgba(20,16,12,.96); border: 1px solid rgba(255,77,28,.4); color: var(--ink);
    padding: 12px 18px; border-radius: 14px; font-size: .75rem; z-index: 80; opacity: 0; pointer-events: none;
    transition: opacity .3s var(--ease), transform .3s var(--ease); max-width: 84%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .rise { opacity: 0; transform: translateY(18px); animation: rise .9s var(--ease) forwards; }
  .r1 { animation-delay: .05s; } .r2 { animation-delay: .13s; } .r3 { animation-delay: .24s; } .r4 { animation-delay: .34s; } .r5 { animation-delay: .44s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
</style>
</head>
<body class="on">

<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header>
  <div class="topline">
    <div class="lang">
      <button id="langRu" class="active">RU</button>
      <button id="langEn">EN</button>
    </div>
    <span class="devchip" id="devChip">-</span>
  </div>
  <h1 class="rise r2">Dolby <em>Atmos</em></h1>
  <p class="sub rise r2" data-i18n="subtitle"></p>
</header>

<main class="stage">
  <div class="eqhead rise r3" id="eq" aria-hidden="true"></div>
  <button class="switch rise r3" id="sw" aria-label="Dolby">
    <span class="knob"></span>
    <span class="cap off" id="capOff"></span>
    <span class="cap on" id="capOn"></span>
  </button>
  <p class="status rise r4" id="status"><span class="dot"></span><span id="statusText"></span></p>
</main>

<section class="panel rise r4">
  <h2 data-i18n="profileTitle"></h2>
  <div class="chips" id="profiles">
    <button class="chip active" data-p="dolby">Dolby</button>
    <button class="chip" data-p="music" data-i18n="profMusic"></button>
    <button class="chip" data-p="movie" data-i18n="profMovie"></button>
    <button class="chip" data-p="bass" data-i18n="profBass"></button>
    <button class="chip" data-p="custom" data-i18n="profCustom"></button>
  </div>
</section>

<section class="panel rise r5">
  <h2 data-i18n="tuningTitle"></h2>
  <div class="rows">
    <div class="row">
      <div class="top"><span class="name" data-i18n="bassName"></span><span class="val" id="vBass"></span></div>
      <input type="range" id="sBass" min="0" max="192" step="8" value="0">
      <div class="desc" data-i18n="bassDesc"></div>
    </div>
    <div class="row">
      <div class="top"><span class="name" data-i18n="deName"></span><span class="val" id="vDe"></span></div>
      <input type="range" id="sDe" min="0" max="16" step="1" value="4">
      <div class="desc" data-i18n="deDesc"></div>
    </div>
    <div class="row">
      <div class="top"><span class="name" data-i18n="levName"></span><span class="val" id="vLev"></span></div>
      <input type="range" id="sLev" min="0" max="10" step="1" value="0">
      <div class="desc" data-i18n="levDesc"></div>
    </div>
    <div class="row">
      <div class="top"><span class="name" data-i18n="boostName"></span><span class="val" id="vVmb"></span></div>
      <input type="range" id="sVmb" min="0" max="64" step="2" value="56">
      <div class="desc" data-i18n="boostDesc"></div>
    </div>
    <div class="row">
      <div class="top"><span class="name" data-i18n="sceneName"></span><span class="val" id="vScene"></span></div>
      <input type="range" id="sScene" min="0" max="20" step="1" value="10">
      <div class="desc" data-i18n="sceneDesc"></div>
    </div>
    <div class="row">
      <div class="top"><span class="name" data-i18n="vbName"></span><span class="val" id="vVb"></span></div>
      <input type="range" id="sVb" min="0" max="100" step="5" value="0">
      <div class="desc" data-i18n="vbDesc"></div>
    </div>
    <div class="row">
      <div class="top"><span class="name" data-i18n="peakName"></span><span class="val" id="vPeak"></span></div>
      <input type="range" id="sPeak" min="64" max="256" step="16" value="256">
      <div class="desc" data-i18n="peakDesc"></div>
    </div>
    <div class="row">
      <div class="top"><span class="name" data-i18n="ieqAmtName"></span><span class="val" id="vIeq"></span></div>
      <input type="range" id="sIeq" min="0" max="16" step="1" value="4">
      <div class="desc" data-i18n="ieqAmtDesc"></div>
    </div>
  </div>
</section>

<section class="panel rise r5">
  <h2 data-i18n="ieqTitle"></h2>
  <div class="chips" id="ieqPresets">
    <button class="chip active" data-ieq="off" data-i18n="ieqOff"></button>
    <button class="chip" data-ieq="detailed" data-i18n="ieqDetailed"></button>
    <button class="chip" data-ieq="balanced" data-i18n="ieqBalanced"></button>
    <button class="chip" data-ieq="warm" data-i18n="ieqWarm"></button>
  </div>
</section>

<section class="panel rise r5">
  <h2 data-i18n="eqTitle"></h2>
  <div class="geq" id="geq"></div>
  <div class="scale"><span>47</span><span>234</span><span>1031</span><span>4688</span><span>19.7k</span></div>
  <div class="eqinfo" id="geqInfo"></div>
  <button class="link" id="geqReset" style="align-self: flex-start; margin-top: 12px" data-i18n="eqReset"></button>
</section>

<section class="panel rise r5">
  <h2 data-i18n="fxTitle"></h2>
  <div class="toggles" id="toggles">
    <button class="tg active" data-k="ngon" id="tgNgon"></button>
    <button class="tg active" data-k="lave" id="tgLave"></button>
    <button class="tg active" data-k="rvse" id="tgRvse"></button>
    <button class="tg" data-k="hpon" id="tgHpon"></button>
    <button class="tg" data-k="aron" id="tgAron"></button>
    <button class="tg active" data-k="autoDev" id="tgAuto"></button>
  </div>
</section>

<section class="panel rise r5">
  <h2 data-i18n="presetsTitle"></h2>
  <div class="presets">
    <div class="prow">
      <input type="text" id="presetName" placeholder="">
      <button class="small accent" id="presetSave" data-i18n="saveBtn"></button>
    </div>
    <div class="plist" id="presetList"></div>
    <div class="prow">
      <button class="small" id="exportBtn" data-i18n="exportBtn"></button>
      <button class="small" id="importBtn" data-i18n="importBtn"></button>
    </div>
    <textarea id="presetText" spellcheck="false"></textarea>
  </div>
</section>

<footer>
  <p class="hint" id="hint" data-i18n="hint"></p>
  <p class="badge" id="mode"></p>
  <button class="link" id="logBtn" data-i18n="logBtn"></button>
  <pre class="log" id="logBox"></pre>
</footer>

<div class="toast" id="toast"></div>

      presetsTitle: "Мои пресеты", presetPlaceholder: "название пресета",
      saveBtn: "Сохранить", exportBtn: "Показать текстом", importBtn: "Применить текст",
      hint: "Включи музыку и меняй настройки: всё применяется на лету.",
      logBtn: "Лог обработки",
      devSpeaker: "выход: динамик", devHeadphone: "выход: наушники", devUnknown: "выход: -",
      eqFlat: "все полосы 0 дБ", eqActive: "активных полос: ",
      saved: "Пресет сохранён", applied: "Применено", needRoot: "Нет доступа: разреши root в KernelSU",
      modeDirect: "управление: напрямую", modeSu: "управление: через root", modeNone: "управление: нет доступа"
    },
    en: {
      subtitle: "Sound processing by the Dolby engine",
      on: "ON", off: "OFF",
      onText: "Dolby is on", offText: "Dolby is off",
      profileTitle: "Profile", profMusic: "Music", profMovie: "Movie", profBass: "Bass", profCustom: "Custom",
      tuningTitle: "Sound tuning",
      bassName: "Bass", bassDesc: "Dolby bass enhancer (beb). 0 disables it, 192 is the reference profile maximum.",
      deName: "Dialogue", deDesc: "Highlights speech and vocals (dialog enhancer).",
      levName: "Volume leveling", levDesc: "Volume leveler: lifts quiet parts and evens out loudness.",
      boostName: "Overall boost", boostDesc: "Volume maximizer. With auto profile it follows the output device.",
      sceneName: "Scene width", sceneDesc: "Virtual speaker angles. Most noticeable on headphones.",
      vbName: "Virtual bass", vbDesc: "Rebuilds low frequencies with harmonics: audible on the phone speaker. 0 disables it.",
      peakName: "Volume ceiling", peakDesc: "Peak limiter: lower values are softer on loud passages. 256 matches the reference profile.",
      ieqAmtName: "Intelligent EQ strength", ieqAmtDesc: "How strongly the intelligent equalizer corrects the tone.",
      ieqTitle: "Dolby Intelligent EQ curves", ieqOff: "Off", ieqDetailed: "Detailed",
      ieqBalanced: "Balanced", ieqWarm: "Warm",
      eqTitle: "Equalizer: 20 bands", eqReset: "Reset equalizer",
      fxTitle: "Effects", fxSurround: "Surround", fxVirtual: "Virtualizer", fxClean: "Reverb clean",
      fxProtect: "Hearing protection", fxSpeaker: "Speaker protection", fxAutoDev: "Auto profile",
      presetsTitle: "My presets", presetPlaceholder: "preset name",
      saveBtn: "Save", exportBtn: "Show as text", importBtn: "Apply text",
      hint: "Start playing music and change settings: everything applies instantly.",
      logBtn: "Processing log",
      devSpeaker: "output: speaker", devHeadphone: "output: headphones", devUnknown: "output: -",
      eqFlat: "all bands at 0 dB", eqActive: "active bands: ",
      saved: "Preset saved", applied: "Applied", needRoot: "No access: allow root in KernelSU",
      modeDirect: "control: direct", modeSu: "control: via root", modeNone: "control: no access"
    }
  };
  function t(k) { return (T[lang] && T[lang][k]) || k; }

  /* ---------- состояние ---------- */
  var GEQ_FREQS = [47, 141, 234, 328, 469, 656, 844, 1031, 1313, 1688,
                   2250, 3000, 3750, 4688, 5813, 7125, 9000, 11250, 13875, 19688];
  var GEQ_MAX = 12;

  /* эталонные кривые Intelligent EQ из профиля Dolby */
  var IEQ_CURVES = {
    detailed: [150, 142, 188, 216, 189, 195, 202, 199, 210, 225, 230, 236, 235, 235, 214, 165, 112, 49, -24, -217],
    balanced: [157, 167, 218, 218, 203, 188, 192, 192, 205, 213, 218, 209, 193, 159, 134, 97, 71, 22, -90, -283],
    warm:     [114, 146, 183, 169, 170, 128, 103, 90, 98, 126, 127, 140, 96, 85, 80, 66, 38, -32, -132, -275]
  };

  var state = {
    bass: 0, de: 4, lev: 0, vmb: 56, ieq: 4, scene: 10, vbass: 0, peak: 256,
    ngon: 1, lave: 1, rvse: 1, hpon: 0, aron: 0, autoDev: 1,
    ieqPreset: "off",
    bands: new Array(GEQ_FREQS.length).fill(0),
    device: ""
  };

  var PROFILES = {
    dolby: { bass: 0, de: 4, lev: 0, vmb: 56, ieq: 4, scene: 10, vbass: 0, peak: 256, ngon: 1, lave: 1, rvse: 1, hpon: 0, aron: 0, ieqPreset: "off" },
    music: { bass: 0, de: 0, lev: 0, vmb: 32, ieq: 6, scene: 8, vbass: 0, peak: 256, ngon: 1, lave: 0, rvse: 1, hpon: 0, aron: 0, ieqPreset: "balanced" },
    movie: { bass: 0, de: 6, lev: 3, vmb: 48, ieq: 4, scene: 14, vbass: 0, peak: 256, ngon: 1, lave: 1, rvse: 1, hpon: 0, aron: 0, ieqPreset: "detailed" },
    bass:  { bass: 160, de: 4, lev: 2, vmb: 64, ieq: 4, scene: 10, vbass: 60, peak: 224, ngon: 1, lave: 0, rvse: 1, hpon: 0, aron: 1, ieqPreset: "warm" }
  };
  var profile = "dolby";

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 3200);
  }

  (function buildHeadEq() {
    var eq = $("eq");
    for (var i = 0; i < 14; i++) {
      var bar = document.createElement("i");
      bar.style.setProperty("--h", (34 + Math.round(72 * Math.abs(Math.sin(i * 1.7)) + Math.random() * 14)) + "px");
      bar.style.setProperty("--t", (0.55 + (i % 5) * 0.12).toFixed(2));
      bar.style.animationDelay = (-Math.random() * 1.5).toFixed(2) + "s";
      eq.appendChild(bar);
    }
  })();

  /* ---------- формирование файла настроек ---------- */
  function headphone() { return state.device === "headphone"; }

  function paramsLines() {
    var vmb = state.autoDev ? (headphone() ? 32 : 56) : state.vmb;
    var lines = [
      "beon " + (state.bass > 0 ? 1 : 0),
      "beb " + state.bass,
      "deon " + (state.de > 0 ? 1 : 0),
      "dea " + state.de,
      "dvle 1",
      "dvla " + state.lev,
      "vmb " + vmb,
      "ieon 1",
      "iea " + state.ieq,
      "ngon " + state.ngon,
      "lave " + state.lave,
      "rvse " + state.rvse,
      "hpon " + state.hpon,
      "aron " + (state.aron ? 1 : 0),
      "arde " + (state.aron ? 1 : 0),
      "ards 8",
      "dplp " + state.peak,
      "dfsa " + state.scene,
      "dsa " + state.scene,
      "dhsa " + state.scene,
      "gebs " + GEQ_FREQS.length + " " + GEQ_FREQS.join(" ") + " " +
        state.bands.map(function (db) { return Math.round(db * 16); }).join(" ")
    ];
    if (state.ieqPreset !== "off" && IEQ_CURVES[state.ieqPreset]) {
      lines.push("iebs " + GEQ_FREQS.length + " " + GEQ_FREQS.join(" ") + " " + IEQ_CURVES[state.ieqPreset].join(" "));
    }
    if (state.vbass > 0) {
      var strength = Math.round(-200 * (100 - state.vbass) / 100);
      lines.push("vbm 3");
      lines.push("vbmf 94 469");
      lines.push("vbsf 35 160");
      lines.push("vbsg -32 -144 -192");
      lines.push("vbhg -2080 48 48 48");
      lines.push("vbct 0 0 -320 96 32 50 50");
      lines.push("vbrg 0");
      lines.push("vbog " + strength);
    } else {
      lines.push("vbm 0");
    }
    return lines;
  }

  function paramsText() { return paramsLines().join("\n") + "\n"; }

  function pushParams() {
    if (!bridge) return;
    try { bridge.setParams(paramsText()); } catch (e) {}
  }
  function pushDebounced() {
    if (writeTimer) clearTimeout(writeTimer);
    writeTimer = setTimeout(pushParams, 220);
  }

  /* ---------- разбор файла настроек ---------- */
  function parseParams(text) {
    var map = {};
    text.split("\n").forEach(function (line) {
      var s = line.trim();
      if (!s || s.charAt(0) === "#") return;
      var p = s.split(/\s+/);
      if (p[0] === "gebs" || p[0] === "iebs") {
        var n = parseInt(p[1], 10) || 0;
        var vals = p.slice(2 + n, 2 + 2 * n).map(function (v) { return parseInt(v, 10) || 0; });
        if (p[0] === "gebs") {
          map.__geq = vals;
        } else {
          var name = "custom";
          Object.keys(IEQ_CURVES).forEach(function (k) {
            var c = IEQ_CURVES[k], same = c.length === vals.length;
            if (same) { for (var i = 0; i < c.length; i++) { if (c[i] !== vals[i]) same = false; } }
            if (same) name = k;
          });
          map.__ieq = name;
        }
        return;
      }
      if (p.length >= 2) {
        var v = parseInt(p[1], 10);
        if (isFinite(v)) map[p[0]] = v;
      }
    });
    return map;
  }

  function applyMap(map) {
    if (isFinite(map.beb)) state.bass = map.beb;
    if (isFinite(map.dea)) state.de = map.dea;
    if (isFinite(map.dvla)) state.lev = map.dvla;
    if (isFinite(map.vmb)) { state.vmb = map.vmb; state.autoDev = 0; }
    if (isFinite(map.iea)) state.ieq = map.iea;
    if (isFinite(map.dfsa)) state.scene = map.dfsa;
    if (isFinite(map.dplp)) state.peak = map.dplp;
    if (isFinite(map.ngon)) state.ngon = map.ngon;
    if (isFinite(map.lave)) state.lave = map.lave;
    if (isFinite(map.rvse)) state.rvse = map.rvse;
    if (isFinite(map.hpon)) state.hpon = map.hpon;
    if (isFinite(map.aron)) state.aron = map.aron;
    if (isFinite(map.vbm)) {
      state.vbass = map.vbm > 0 ? (isFinite(map.vbog) ? Math.max(5, Math.min(100, Math.round(100 + map.vbog / 2))) : 60) : 0;
    }
    if (map.__geq && map.__geq.length) {
      var g = map.__geq.slice(0, GEQ_FREQS.length);
      while (g.length < GEQ_FREQS.length) g.push(0);
      state.bands = g.map(function (v) { return v / 16; });
    }
    if (map.__ieq) state.ieqPreset = map.__ieq;
    profile = "custom";
    var flat = state.bands.every(function (v) { return Math.round(v * 16) === 0; });
    Object.keys(PROFILES).forEach(function (k) {
      var p = PROFILES[k], same = true;
      Object.keys(p).forEach(function (f) { if (p[f] !== state[f]) same = false; });
      if (same && flat) profile = k;
    });
  }

  function readParams() {
    if (!bridge) return;
    var text = "";
    try { text = bridge.getParams() || ""; } catch (e) { return; }
    if (!text.trim()) return;
    applyMap(parseParams(text));
  }

  /* ---------- отрисовка ---------- */
  function syncInputs() {
    $("sBass").value = state.bass;
    $("sDe").value = state.de;
    $("sLev").value = state.lev;
    $("sVmb").value = state.vmb;
    $("sIeq").value = state.ieq;
    $("sScene").value = state.scene;
    $("sVb").value = state.vbass;
    $("sPeak").value = state.peak;
    $("vBass").textContent = state.bass > 0 ? state.bass : (lang === "ru" ? "выкл" : "off");
    $("vDe").textContent = state.de;
    $("vLev").textContent = state.lev;
    $("vVmb").textContent = state.autoDev ? (headphone() ? "32 auto" : "56 auto") : state.vmb;
    $("vIeq").textContent = state.ieq;
    $("vScene").textContent = state.scene;
    $("vVb").textContent = state.vbass > 0 ? state.vbass + "%" : (lang === "ru" ? "выкл" : "off");
    $("vPeak").textContent = state.peak;
  }

  function render() {
    var on = !bypassed;
    document.body.classList.toggle("on", on);
    document.body.classList.toggle("off", !on);
    document.documentElement.style.setProperty("--dim", bypassed ? "1" : "0");
    $("statusText").textContent = on ? t("onText") : t("offText");
    $("capOn").textContent = t("on");
    $("capOff").textContent = t("off");

    $("devChip").textContent = state.device === "headphone" ? t("devHeadphone")
                             : state.device === "speaker" ? t("devSpeaker") : t("devUnknown");
    $("devChip").classList.toggle("hp", state.device === "headphone");

    syncInputs();
    renderGeq();

    Array.prototype.forEach.call(document.querySelectorAll("#profiles .chip"), function (c) {
      c.classList.toggle("active", c.dataset.p === profile);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#toggles .tg"), function (b) {
      b.classList.toggle("active", !!state[b.dataset.k]);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#ieqPresets .chip"), function (c) {
      c.classList.toggle("active", c.dataset.ieq === state.ieqPreset);
    });
    $("tgNgon").innerHTML = t("fxSurround") + '<span class="lamp"></span>';
    $("tgLave").innerHTML = t("fxVirtual") + '<span class="lamp"></span>';
    $("tgRvse").innerHTML = t("fxClean") + '<span class="lamp"></span>';
    $("tgHpon").innerHTML = t("fxProtect") + '<span class="lamp"></span>';
    $("tgAron").innerHTML = t("fxSpeaker") + '<span class="lamp"></span>';
    $("tgAuto").innerHTML = t("fxAutoDev") + '<span class="lamp"></span>';
  }

  function applyLang() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.dataset.i18n);
    });
    $("presetName").placeholder = t("presetPlaceholder");
    $("langRu").classList.toggle("active", lang === "ru");
    $("langEn").classList.toggle("active", lang === "en");
    document.documentElement.lang = lang;
    render();
  }

  /* ---------- эквалайзер ---------- */
  function renderGeq() {
    var cols = $("geq").querySelectorAll(".col");
    for (var i = 0; i < cols.length; i++) {
      var bar = cols[i].querySelector(".bar");
      var db = state.bands[i] || 0;
      var h = Math.min(50, Math.abs(db) / GEQ_MAX * 50);
      bar.style.top = (db >= 0 ? (50 - h) : 50) + "%";
      bar.style.height = h + "%";
      bar.classList.toggle("neg", db < 0);
    }
    var active = state.bands.filter(function (v) { return Math.round(v * 16) !== 0; }).length;
    $("geqInfo").textContent = active === 0 ? t("eqFlat") : t("eqActive") + active;
  }

  (function buildGeq() {
    var host = $("geq");
    for (var i = 0; i < GEQ_FREQS.length; i++) {
      var col = document.createElement("div");
      col.className = "col";
      col.innerHTML = '<div class="mid"></div><div class="bar"></div><div class="zero"></div>';
      host.appendChild(col);
    }
    var dragging = false;
    function applyFromPointer(e) {
      var rect = host.getBoundingClientRect();
      var x = e.clientX - rect.left - 10;
      var y = e.clientY - rect.top - 12;
      var innerW = rect.width - 20, innerH = rect.height - 24;
      var idx = Math.floor(x / (innerW / GEQ_FREQS.length));
      if (idx < 0) idx = 0;
      if (idx >= GEQ_FREQS.length) idx = GEQ_FREQS.length - 1;
      var db = (0.5 - y / innerH) * 2 * GEQ_MAX;
      db = Math.max(-GEQ_MAX, Math.min(GEQ_MAX, Math.round(db)));
      state.bands[idx] = db;
      profile = "custom";
      renderGeq();
      pushDebounced();
    }
    host.addEventListener("pointerdown", function (e) {
      dragging = true;
      try { host.setPointerCapture(e.pointerId); } catch (err) {}
      applyFromPointer(e);
      e.preventDefault();
    });
    host.addEventListener("pointermove", function (e) {
      if (dragging) { applyFromPointer(e); e.preventDefault(); }
    });
    host.addEventListener("pointerup", function () {
      dragging = false;
      pushParams();
      if (navigator.vibrate) navigator.vibrate(6);
    });
    host.addEventListener("pointercancel", function () { dragging = false; });
  })();

  $("geqReset").addEventListener("click", function () {
    state.bands = new Array(GEQ_FREQS.length).fill(0);
    renderGeq();
    pushParams();
  });

  /* ---------- тумблер ---------- */
  function toggle() {
    var target = !bypassed;
    var res = false;
    if (bridge) { try { res = !!bridge.setBypassed(target); } catch (e) { res = false; } }
    if (navigator.vibrate) navigator.vibrate(12);
    if (bridge && !res) { toast(t("needRoot")); return; }
    bypassed = target;
    render();
    if (!bypassed) pushParams();
  }
  $("sw").addEventListener("click", toggle);
  $("eq").addEventListener("click", toggle);

  /* ---------- профили ---------- */
  $("profiles").addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    var p = btn.dataset.p;
    profile = p;
    if (PROFILES[p]) {
      var src = PROFILES[p];
      Object.keys(src).forEach(function (k) { state[k] = src[k]; });
      state.bands = new Array(GEQ_FREQS.length).fill(0);
    }
    render();
    pushParams();
    if (navigator.vibrate) navigator.vibrate(8);
  });

  /* ---------- кривые IEQ ---------- */
  $("ieqPresets").addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    state.ieqPreset = btn.dataset.ieq;
    profile = "custom";
    render();
    pushParams();
    if (navigator.vibrate) navigator.vibrate(8);
  });

  /* ---------- ползунки ---------- */
  function bindSlider(id, field) {
    var el = $(id);
    el.addEventListener("input", function () {
      state[field] = parseInt(el.value, 10);
      if (field === "vmb") state.autoDev = 0;
      profile = "custom";
      render();
      pushDebounced();
    });
    el.addEventListener("change", function () { pushParams(); if (navigator.vibrate) navigator.vibrate(6); });
  }
  bindSlider("sBass", "bass");
  bindSlider("sDe", "de");
  bindSlider("sLev", "lev");
  bindSlider("sVmb", "vmb");
  bindSlider("sIeq", "ieq");
  bindSlider("sScene", "scene");
  bindSlider("sVb", "vbass");
  bindSlider("sPeak", "peak");

  /* ---------- тумблеры эффектов ---------- */
  $("toggles").addEventListener("click", function (e) {
    var btn = e.target.closest(".tg");
    if (!btn) return;
    var k = btn.dataset.k;
    state[k] = state[k] ? 0 : 1;
    profile = "custom";
    render();
    pushParams();
    if (navigator.vibrate) navigator.vibrate(8);
  });

  /* ---------- пресеты ---------- */
  function renderPresets() {
    var list = $("presetList");
    list.innerHTML = "";
    if (!bridge) return;
    var names = [];
    try { names = (bridge.listPresets() || "").split("\n").filter(function (s) { return s.trim(); }); } catch (e) {}
    names.forEach(function (name) {
      var wrap = document.createElement("span");
      wrap.className = "pitem";
      var load = document.createElement("button");
      load.className = "chip";
      load.textContent = name;
      load.addEventListener("click", function () {
        var text = "";
        try { text = bridge.loadPreset(name) || ""; } catch (e) {}
        if (!text.trim()) return;
        applyMap(parseParams(text));
        render();
        pushParams();
        toast(t("applied") + ": " + name);
      });
      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "x";
      del.addEventListener("click", function () {
        try { bridge.deletePreset(name); } catch (e) {}
        renderPresets();
      });
      wrap.appendChild(load);
      wrap.appendChild(del);
      list.appendChild(wrap);
    });
  }

  $("presetSave").addEventListener("click", function () {
    var name = $("presetName").value.trim();
    if (!name || !bridge) return;
    var ok = false;
    try { ok = !!bridge.savePreset(name, paramsText()); } catch (e) {}
    toast(ok ? t("saved") + ": " + name : t("needRoot"));
    renderPresets();
  });

  $("exportBtn").addEventListener("click", function () { $("presetText").value = paramsText(); });

  $("importBtn").addEventListener("click", function () {
    var text = $("presetText").value;
    if (!text.trim()) return;
    applyMap(parseParams(text));
    render();
    pushParams();
    toast(t("applied"));
  });

  /* ---------- язык ---------- */
  $("langRu").addEventListener("click", function () { lang = "ru"; applyLang(); });
  $("langEn").addEventListener("click", function () { lang = "en"; applyLang(); });

  /* ---------- лог ---------- */
  var logOpen = false;
  $("logBtn").addEventListener("click", function () {
    var box = $("logBox");
    logOpen = !logOpen;
    box.style.display = logOpen ? "block" : "none";
    if (logOpen && bridge) { try { box.textContent = bridge.logTail() || "(пусто)"; } catch (e) {} }
  });

  /* ---------- состояние моста: устройство вывода ---------- */
  var lastDev = "";
  var devVotes = 0;
  function readStatus() {
    if (!bridge) return;
    var dev = "";
    try { dev = bridge.currentOutput() || ""; } catch (e) { dev = ""; }
    if (!dev) {
      var s = "";
      try { s = bridge.status() || ""; } catch (e) { s = ""; }
      if (s) dev = /headphone=1/.test(s) ? "headphone" : "speaker";
    }
    if (!dev) return;
    /* переключаемся только после двух одинаковых показаний подряд */
    if (dev === lastDev) { devVotes++; } else { lastDev = dev; devVotes = 1; }
    if (dev !== state.device && devVotes >= 2) {
      state.device = dev;
      try { bridge.setDeviceHint(dev); } catch (e) {}
      render();
      if (state.autoDev && !bypassed) pushParams();
    }
  }

  /* ---------- запуск ---------- */
  if (bridge) {
    try {
      var m = bridge.mode();
      $("mode").textContent = m === "direct" ? t("modeDirect") : m === "su" ? t("modeSu") : t("modeNone");
    } catch (e) {}
    try { bypassed = !!bridge.isBypassed(); } catch (e) {}
    readStatus();
    readParams();
    renderPresets();
  } else {
    $("mode").textContent = "bridge N/A";
  }
  applyLang();

  setInterval(function () {
    if (!bridge) return;
    var now = false;
    try { now = !!bridge.isBypassed(); } catch (e) { return; }
    if (now !== bypassed) { bypassed = now; render(); }
    readStatus();
  }, 2000);
})();
</script>

</body>
